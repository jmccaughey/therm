<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR Sensor Heatmap</title>
<style>
  /* Make page and canvas fill the viewport, no scrollbars or gaps */
  html, body {
    height: 100%;
    margin: 0;
  }

  .videocanvas {
            border: 1px solid black;
            opacity: 20%;
        }
  /* Use the viewport size — avoids issues with body margins/padding */
  canvas {
    position: absolute;
    width: 100vw;                /* fill viewport width */
    height: 100vh;               /* fill viewport height */
    touch-action: none;          /* optional: prevents double-tap zoom on mobile */
  }
  video.fullscreen {
      width: 400;
      height: 300;
      object-fit: cover; /* crop to fill */
    }
  .hidden {
            display: none;
  }
</style>
</head>
<body>
    <a style="display: none;" href="recordings/2026-01-11T23_44_43.203Z_therm_recording.zip">recording</a>
<canvas id="heatmap" width="100%" height="100%"></canvas>
<canvas id="videoCanvas" class="videocanvas" width="640" height="480"></canvas>
<!--<img class="fullscreen" src="hike.jpg" alt="">-->
<video id="video1" class="hidden" autoplay muted playsinline webkit-playsinline controls></video>
<!-- Include chroma.js for color scaling -->
<script src="https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/chroma.min.js"></script>
<script type="text/javascript" src="zip.min.js"></script>
<script>
    // https://jsfiddle.net/jib1/yxbLvjm6/
  const pc1 = new RTCPeerConnection();
  const video = document.getElementById('video1');
  const videocanvas = document.getElementById('videoCanvas');
  const canvas = document.getElementById('heatmap');
  const ctx = canvas.getContext('2d');
  const videoctx = videoCanvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;

  // Thermal gradient (cold → hot)
  const colorScale = chroma.scale([
    '#00008B10', // Dark blue (cold)
    '#0000FF24',
    '#00FFFF38',
    '#FFFF004C',
    '#FF450060',
    '#FF000088', // Red (hot)
    '#FFFFFF88'  // White (max)
  ]).domain([14, 26]); // IR intensity

  var alreadyUsingRearCamera = false;
  let chunks = [];
  let thermChunks = [];
  var mediaRecorder;
  var recordingStart = null;
  var downloadPending = false;
  var thermalEvents = null;
  var lastSleepMillis = 0;
  var lastTimestamp = 0;
  var offsetMillis = 0;
  var videoBufferMillis = 400;

  document.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
      event.preventDefault(); // prevents page scrolling
      console.log("Space bar pressed");
      downloadVideoRecording();
      downloadTherm();
    }
  });   

  video.addEventListener('canplaythrough', () => {
      video.play();
  });

  video.addEventListener('play', () => {
    function drawVideoFrame() {
        // Draw the current frame of the video onto the canvas
        videoctx.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);

        // Request the next frame to continue the animation loop
        requestAnimationFrame(drawVideoFrame);
    }

    // Start the initial animation frame
    requestAnimationFrame(drawVideoFrame);
  });

  function drawHeatmap(data) {
      const rows = data.values.length
      const columns = data.values[0].length    
    ctx.clearRect(0,0,canvas.width,canvas.height);  
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < columns; x++) {
        const temp = data.values[y][x];
        ctx.fillStyle = colorScale(temp).hex();
          const cellWidth = width / columns;
          const cellHeight = height / rows;
        ctx.fillRect(x * cellWidth, y * cellHeight, cellWidth, cellHeight);
      }
    }
  }
    
    async function findRearCamera() {
        videoId = "";
        await navigator.mediaDevices
            .enumerateDevices()
            .then((devices) => {
              devices.forEach((device) => {
                if (device.kind.includes("ideoinput") && device.label.includes("ack")) {
                    videoId = device.deviceId;
                }
              });
            })
            .catch((err) => {
              console.error(err.name + " " + err.message);
            });
            return videoId;
    }
    
    async function switchToRearCamera() {
        // only possible after default camera has started (after user grants perms)
        // get ID of rear camera
        if (alreadyUsingRearCamera) {
          return;
        }
        rearCameraId = await findRearCamera();
        if (rearCameraId.length > 0) {
            console.log("switching to rear camera: " + rearCameraId)
            rearConstraints = { video: { deviceId: { exact: rearCameraId }}};
            rearStream = await navigator.mediaDevices.getUserMedia(rearConstraints);
            console.log("...got rear stream: " + rearStream)
            rearVideo = await rearStream.getVideoTracks()[0];
            console.log("...got rear video: " + rearVideo + "...")
            result = await pc1.getSenders()[0].replaceTrack(rearVideo);
            console.log("...got result " + result)
            video1.srcObject = rearStream;
            alreadyUsingRearCamera = true;
            startStream();
        }
    }

    function getPlaybackName() {
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        if (urlParams.has('recording')) {
            return urlParams.get('recording');
        } 
        return "";
    }

    
    (async () => {
        const playbackName = getPlaybackName();
        if (playbackName.length > 0) {
            startPlayback(playbackName);
        } else {
            startLive();
        }
    })();

function buildThermFileName(playbackName) { 
    return "recordings/" + playbackName + "_therm_recording.zip";
}

function buildVideoFileName(playbackName) { 
    return "recordings/" + playbackName + "_recording.webm";
}

async function startPlayback(playbackName) {
    const videoFile = buildVideoFileName(playbackName);
    console.log("video file is " + videoFile);
    const thermFile = buildThermFileName(playbackName);
    console.log("therm file is " + thermFile);
    const thermBlob = await getThermalBlob(thermFile);
    console.log("got thermBlob: " + thermBlob.length);
    const dataBlob = await getThermReadings(thermBlob);
    const text = await dataBlob.text()
    console.log("got new therm data decompressed: " + text);
    thermalEvents = collectEvents(text);
    console.log("got events " + events.length);
    fireThermalEvent();
    video1.src = videoFile;
}

function fireThermalEvent() {
    event = thermalEvents[0];
    if (offsetMillis == 0) {
        offsetMillis = (Date.now() - event.ts) + videoBufferMillis;
    }
    tsLast = event.ts;
    drawHeatmap(event);
    events.shift();
    if (thermalEvents.length > 0) {
        // time elapsed is usually longer than requested, so catch up
        nowMillis = Date.now();
        sleepAmount = (thermalEvents[0].ts + offsetMillis) - nowMillis;
        sleptMillis = nowMillis - lastTimestamp;
        // console.log("slept: " + sleptMillis + " scheduled " + lastSleepMillis);
        // console.log("setting timeout to " + sleepAmount + " millis");
        setTimeout(fireThermalEvent, sleepAmount);
        lastSleepMillis = sleepAmount;
        lastTimestamp = nowMillis;
    } else {
        console.log("thermal event stream ended");
    }
}

function collectEvents(text){
    events = new Array();
    lines = text.split('\n');
    console.log("got lines " + lines.length);
    for (const line of lines) {
        if (line.length > 0) {
            event = JSON.parse(line);
            events.push(event);
        }
    }
    return events;
}

async function getThermReadings(thermBlob) {
    const zipFileReader = new zip.BlobReader(thermBlob);
    const zipReader = new zip.ZipReader(zipFileReader);
    const entries = await zipReader.getEntries();

  if (entries.length != 1) {
    throw new Error("Expected one entry in zip file, found " + entries.length);
  }
  const firstEntry = entries[0];

  if (firstEntry.directory) {
      throw new Error("The entry is a directory, not a file.");
  }
  const dataBlob = await firstEntry.getData(new zip.BlobWriter());
  await zipReader.close();
  return dataBlob;
}

async function getThermalBlob(thermFile) {
    const response = await fetch(thermFile);    
    if (!response.ok) {
      throw new Error('Network response was not ok');
    } else {
        console.log("fetched " + thermFile);
    }
    const zipBlob = await response.blob(); 
    return await zipBlob;
}

async function startLive() {
      try {
        console.log("requesting camera perms...")
        userMediaParams = {video: true, audio: false};
        const stream = await navigator.mediaDevices.getUserMedia(userMediaParams);
        for (const track of stream.getTracks()) {
          await pc1.addTrack(track, stream);
        }
        video1.srcObject = stream;
        startStream();
      } catch (e) {
        console.log(e);
      }
}

async function* makeTextFileLineIterator(fileURL) {
  const utf8Decoder = new TextDecoder("utf-8");
  console.log("fetching " + fileURL);
  let response = await fetch(fileURL);
  console.log("...fetched " + fileURL);
  let reader = response.body.getReader();
  let { value: chunk, done: readerDone } = await reader.read();
  chunk = chunk ? utf8Decoder.decode(chunk, { stream: true }) : "";
  // console.log("got chunk: " + chunk);
  let re = /\r?\n/g;
  let startIndex = 0;

  for (;;) {
    let result = re.exec(chunk);
    if (!result) {
      if (readerDone) {
        break;
      }
      let remainder = chunk.substring(startIndex);
      ({ value: chunk, done: readerDone } = await reader.read());
      chunk =
        remainder + (chunk ? utf8Decoder.decode(chunk, { stream: true }) : "");
      startIndex = re.lastIndex = 0;
      continue;
    }
    var out = chunk.substring(startIndex, result.index) + "\n";
    thermChunks.push(out);
    yield out;
    startIndex = re.lastIndex;
  }
  if (startIndex < chunk.length) {
    // last line didn't end in a newline char
    var out = chunk.substring(startIndex) + "\n";
    thermChunks.push(out);
    yield out;
  }
}

async function startStream() {
    startVideoRecording();
    for await (let line of makeTextFileLineIterator(document.URL + "ir")) {
        drawHeatmap(JSON.parse(line));
    }
}

function startVideoRecording() {
  // https://developer.mozilla.org/en-US/docs/Web/API/HTMLMediaElement/captureStream#browser_compatibility
  mediaRecorder = new MediaRecorder(videoCanvas.captureStream());
  mediaRecorder.ondataavailable = event => {
            console.log("got MediaRecorder data available");
            chunks.push(event.data);
            if (downloadPending) {
              doDownload();
            }
        };
  recordingStart = new Date();
  mediaRecorder.start();
}

function doDownload() {
  const blob = new Blob(chunks, { type: 'video/webm' });
  const videoURL = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = videoURL;
  a.download = recordingStart.toISOString() + '_recording.webm';
  a.click();
}

function downloadVideoRecording() {
  console.log("stopping MediaRecorder");
  downloadPending = true;
  mediaRecorder.stop();
}

async function downloadTherm() {
    let filenamebase = recordingStart.toISOString() + '_therm_recording';
    const blob = new Blob(thermChunks, { type: 'text/plain' });
  const zipFileWriter = new zip.BlobWriter("application/zip");
  const zipWriter = new zip.ZipWriter(zipFileWriter);
    await zipWriter.add(filenamebase + ".txt", new zip.BlobReader(blob));

    // Close the writer to finalize the zip generation
    const zipFileBlob = await zipWriter.close();
  
  // const textURL = URL.createObjectURL(blob);
  const zipUrl = URL.createObjectURL(zipFileBlob);
  const a = document.createElement('a');
  a.href = zipUrl;
  a.download = filenamebase + '.zip';
  a.click();
  URL.revokeObjectURL(zipUrl)
}

window.addEventListener('orientationchange', () => setTimeout(switchToRearCamera, 100));
</script>
</body>
</html>
