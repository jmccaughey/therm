<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Sensor Heatmap</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .video-container {
      position: fixed;
      inset: 0;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    video.active {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="video-container">
  <video src="recordings/head.mp4" autoplay muted playsinline webkit-playsinline loop></video>
  <video src="recordings/ice.mp4" autoplay muted playsinline webkit-playsinline loop></video>
</div>

<script src="videoslides.js"></script>
</body>
</html>
